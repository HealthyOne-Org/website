<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help shape HealthyOne</title>
<meta name="description" content="Six quick questions about HealthyOne. Get a free month as a thank-you.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon-32x32.png">
<style>
:root{--bg:#F3FBF9;--card:#fff;--ink:#1A2332;--muted:#5A6675;--accent:#2BB3A8;--accent-ink:#FFFFFF;--line:#D5ECE8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;font-weight:700}
.top img{width:34px;height:34px;border-radius:9px}
.bar{height:6px;background:var(--line);border-radius:6px;margin:18px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
h1{font:700 26px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:26px;line-height:1.25;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font:inherit;color:inherit;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--accent);outline:none}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
textarea,input[type=email]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;color:inherit;background:var(--card)}
textarea{min-height:130px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;display:block}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.code{font:700 26px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--card);border:2px dashed var(--accent);border-radius:14px;padding:18px;text-align:center;margin:16px 0;user-select:all}
.small{font-size:14px;color:var(--muted)}
.foot{margin-top:auto;padding-top:30px;font-size:13px;color:var(--muted);text-align:center}
.hide{display:none}
.err{color:#c0392b;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/assets/apps/healthyone/icon.png" alt=""> <span>HealthyOne</span></div>
  <div class="bar"><i id="bar"></i></div>
  <main id="q"></main>
  <div class="foot">Hardaway Labs &middot; Your answers go only to Chris and the team. <a href="/privacy" style="color:inherit">Privacy</a></div>
</div>
<script>
var CFG = {"survey": "healthyone_v1", "appId": "6757052428", "code": "", "reward": "free month of HealthyOne Plus", "thanks": "Your answers go straight to Chris, who builds HealthyOne, and decide what gets built next.", "questions": [{"id": "glp1", "type": "choice", "text": "Are you taking a GLP-1 medication?", "hint": "Ozempic, Wegovy, Mounjaro, Zepbound or similar.", "options": ["Yes, I just started", "Yes, I'm on a steady dose", "I'm coming off it", "No"]}, {"id": "hardest", "type": "choice", "text": "What's the hardest part right now?", "options": ["Eating enough when I'm not hungry", "Getting enough protein", "Side effects", "Losing muscle", "My weight has stalled", "Knowing what to eat", "Something else"]}, {"id": "hoped", "type": "text", "text": "What did you hope HealthyOne would do for you?", "placeholder": "In your own words"}, {"id": "frequency", "type": "choice", "text": "How often do you open HealthyOne?", "options": ["Every day", "A few times a week", "Rarely", "I stopped using it"]}, {"id": "worth_paying", "type": "text", "text": "What would make HealthyOne worth paying for?", "placeholder": "Anything goes"}, {"id": "contact", "type": "contact", "text": "Could we talk for 15 minutes?", "hint": "Chris would love to hear more. Totally optional."}]};

/* PostHog (same project as the website) */
!function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register identify setPersonProperties alias reset get_distinct_id".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
var params = new URLSearchParams(location.search);
var uid = (params.get("uid") || "").slice(0, 100);
var source = (params.get("src") || (uid ? "app" : "web")).slice(0, 40);
posthog.init("phc_jbeSYaK5OAsl5qbZbnsJYU3N3m5258lEZbVWoLWxPWo", {
  api_host: "https://us.i.posthog.com", person_profiles: "identified_only",
  bootstrap: uid ? { distinctID: uid } : undefined
});
posthog.register({ survey: CFG.survey, survey_source: source });

var isAndroid = /Android/i.test(navigator.userAgent);
var answers = {}, step = 0, started = false;
var Q = CFG.questions, root = document.getElementById("q"), bar = document.getElementById("bar");

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function track(ev, props) { try { posthog.capture(ev, props || {}); } catch (e) {} }

function render() {
  bar.style.width = Math.round(step / (Q.length + 1) * 100) + "%";
  root.innerHTML = "";
  if (step >= Q.length) return finish();
  var q = Q[step];
  root.appendChild(el("h1", null, q.text));
  if (q.hint) root.appendChild(el("p", "sub", q.hint));
  if (q.type === "choice") {
    var box = el("div", "opts");
    q.options.forEach(function (o) {
      var b = el("button", "opt", o); b.type = "button";
      b.onclick = function () { answer(q, o); };
      box.appendChild(b);
    });
    root.appendChild(box);
  } else if (q.type === "text") {
    var t = el("textarea"); t.maxLength = 1000; t.placeholder = q.placeholder || "Type your answer"; t.value = answers[q.id] || "";
    root.appendChild(t);
    var row = el("div", "row");
    var skip = el("button", "btn ghost", "Skip"); skip.type = "button"; skip.onclick = function () { answer(q, ""); };
    var next = el("button", "btn", "Next"); next.type = "button"; next.onclick = function () { answer(q, t.value.trim()); };
    row.appendChild(skip); row.appendChild(next); root.appendChild(row);
    setTimeout(function () { t.focus(); }, 50);
  } else if (q.type === "contact") {
    var box2 = el("div", "opts");
    var yes = el("button", "opt", "Yes, here's my email"); yes.type = "button";
    var no = el("button", "opt", "No thanks"); no.type = "button";
    box2.appendChild(yes); box2.appendChild(no); root.appendChild(box2);
    var form = el("div", "hide"); form.style.marginTop = "14px";
    var em = el("input"); em.type = "email"; em.placeholder = "you@example.com"; em.autocomplete = "email";
    var err = el("div", "err hide", "That doesn't look like an email address.");
    var go = el("button", "btn", "Next"); go.type = "button"; go.style.marginTop = "12px";
    form.appendChild(em); form.appendChild(err); form.appendChild(go); root.appendChild(form);
    yes.onclick = function () { yes.classList.add("sel"); no.classList.remove("sel"); form.classList.remove("hide"); em.focus(); };
    no.onclick = function () { answer(q, "no"); };
    go.onclick = function () {
      var v = em.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { err.classList.remove("hide"); return; }
      answers.email = v; answer(q, "yes");
    };
  }
}

function answer(q, value) {
  if (!started) { started = true; track("feedback_survey_started"); }
  answers[q.id] = value;
  track("feedback_survey_answer", { question_id: q.id, question: q.text, answer: String(value).slice(0, 1000), step: step + 1 });
  step++; render(); window.scrollTo(0, 0);
}

function finish() {
  bar.style.width = "100%";
  var props = { platform: isAndroid ? "android" : "ios_or_web", app_user_id: uid || null, wants_call: answers.contact === "yes" };
  Q.forEach(function (q) { if (q.type !== "contact") props["a_" + q.id] = String(answers[q.id] || "").slice(0, 1000); });
  if (answers.email) {
    try { posthog.identify(uid || answers.email, { email: answers.email, feedback_wants_call: answers.contact === "yes" }); } catch (e) {}
  }
  track("feedback_survey_completed", props);

  root.appendChild(el("h1", null, "Thank you!"));
  root.appendChild(el("p", "sub", CFG.thanks));
  if (isAndroid) {
    if (answers.email) {
      root.appendChild(el("p", null, "We'll email your Google Play code to " + answers.email + " within a day."));
      track("feedback_reward_android_email");
    } else {
      askEmail("Your free month on Android comes as a Google Play code by email. Where should we send it?");
    }
    return;
  }
  if (CFG.code) {
    root.appendChild(el("p", null, "Here's your " + CFG.reward + ":"));
    root.appendChild(el("div", "code", CFG.code));
    var a = el("a", "btn", "Redeem in the App Store");
    a.href = "https://apps.apple.com/redeem?ctx=offercodes&id=" + CFG.appId + "&code=" + encodeURIComponent(CFG.code);
    a.onclick = function () { track("feedback_reward_redeem_tapped"); };
    root.appendChild(a);
    root.appendChild(el("p", "small", "One per Apple ID. On a computer? Open this page on your iPhone, or enter the code in the App Store under your account picture → Redeem Gift Card or Code."));
    track("feedback_reward_shown");
  } else {
    if (answers.email) root.appendChild(el("p", null, "We'll email your " + CFG.reward + " to " + answers.email + " within a day."));
    else askEmail("Where should we send your " + CFG.reward + "?");
  }
}

function askEmail(label) {
  var p = el("p", null, label); root.appendChild(p);
  var em = el("input"); em.type = "email"; em.placeholder = "you@example.com"; em.autocomplete = "email"; root.appendChild(em);
  var err = el("div", "err hide", "That doesn't look like an email address."); root.appendChild(err);
  var b = el("button", "btn", "Send my code"); b.type = "button"; b.style.marginTop = "12px"; root.appendChild(b);
  b.onclick = function () {
    var v = em.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { err.classList.remove("hide"); return; }
    try { posthog.identify(uid || v, { email: v }); } catch (e) {}
    track("feedback_reward_email_left", { platform: isAndroid ? "android" : "ios_or_web" });
    p.textContent = "Done. We'll email it to " + v + " within a day."; em.remove(); b.remove(); err.remove();
  };
}

track("feedback_survey_viewed");
render();
</script>
</body>
</html>
